name: Deploy para Revoada

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NAMESPACE: querido-diario

jobs:
  check-secret-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Valida referências a Secret/ConfigMap nos manifestos k8s
        run: python3 scripts/check_secret_refs.py

  deploy:
    needs: check-secret-refs
    runs-on: ubuntu-latest
    environment: production  # habilitar "required reviewers" nas configurações do repo

    steps:
      - uses: actions/checkout@v4

      # ── VPN ────────────────────────────────────────────────────────────────

      - name: Instala WireGuard
        run: sudo apt-get install -y wireguard wireguard-tools

      - name: Conecta à VPN Revoada
        run: |
          echo "${{ secrets.WIREGUARD_CONFIG }}" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
          sleep 2

      # ── kubectl ────────────────────────────────────────────────────────────

      - name: Configura kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_REVOADA }}" > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl config set-context --current --namespace=${{ env.NAMESPACE }}
          kubectl get pods -n ${{ env.NAMESPACE }}

      # ── Overlay production-local ───────────────────────────────────────────
      # O overlay production-local/ é gitignored (contém endpoints internos).
      # O conteúdo de cada arquivo é armazenado como GitHub Secret. Sempre que
      # esses arquivos forem alterados localmente, os secrets precisam ser
      # atualizados (gh secret set NOME < arquivo) — do contrário o próximo
      # deploy reverte silenciosamente qualquer mudança feita direto no
      # cluster (já aconteceu com o endpointCA do backup do Postgres).

      - name: Prepara overlay production-local
        # Os secrets são passados via `env:` (não interpolados direto no
        # `run:`) de propósito: `echo "${{ secrets.X }}" > arquivo` faz o
        # GitHub Actions colar o texto do secret cru dentro do script antes
        # do bash processar — qualquer `$(...)`, aspas ou `*` no conteúdo
        # (ex: o "*/2 * * *" do schedule de um CronJob) é reinterpretado pelo
        # shell (glob expansion etc), corrompendo o YAML. Como valor de env
        # var, o conteúdo chega intacto e "$VAR" só faz expansão de variável.
        env:
          KUSTOMIZATION_PROD_LOCAL: ${{ secrets.KUSTOMIZATION_PROD_LOCAL }}
          POSTGRES_BACKUP_CA_REFRESH_MANIFEST: ${{ secrets.POSTGRES_BACKUP_CA_REFRESH_MANIFEST }}
        run: |
          mkdir -p k8s/overlays/production-local
          printf '%s' "$KUSTOMIZATION_PROD_LOCAL" > k8s/overlays/production-local/kustomization.yaml
          printf '%s' "$POSTGRES_BACKUP_CA_REFRESH_MANIFEST" > k8s/overlays/production-local/postgres-backup-ca-refresh.yaml

      # ── Secrets do cluster (idempotente via --dry-run | apply) ─────────────

      - name: Cria/atualiza secret postgres-credentials
        env:
          POSTGRES_USERNAME: ${{ secrets.POSTGRES_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          kubectl create secret generic postgres-credentials \
            -n "$NAMESPACE" \
            --from-literal=username="$POSTGRES_USERNAME" \
            --from-literal=password="$POSTGRES_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Cria/atualiza secret postgres-backup-secret
        env:
          POSTGRES_BACKUP_ACCESS_KEY: ${{ secrets.POSTGRES_BACKUP_ACCESS_KEY }}
          POSTGRES_BACKUP_SECRET_KEY: ${{ secrets.POSTGRES_BACKUP_SECRET_KEY }}
        run: |
          kubectl create secret generic postgres-backup-secret \
            -n "$NAMESPACE" \
            --from-literal=ACCESS_KEY_ID="$POSTGRES_BACKUP_ACCESS_KEY" \
            --from-literal=SECRET_ACCESS_KEY="$POSTGRES_BACKUP_SECRET_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Cria/atualiza secret app-secret
        env:
          QD_BACKEND_SECRET_KEY: ${{ secrets.QD_BACKEND_SECRET_KEY }}
          POSTGRES_USERNAME: ${{ secrets.POSTGRES_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          OPENSEARCH_HOST: ${{ secrets.OPENSEARCH_HOST }}
          OPENSEARCH_USER: ${{ secrets.OPENSEARCH_USER }}
          OPENSEARCH_PASSWORD: ${{ secrets.OPENSEARCH_PASSWORD }}
          STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
          STORAGE_ACCESS_SECRET: ${{ secrets.STORAGE_ACCESS_SECRET }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
          MAILJET_SECRET_KEY: ${{ secrets.MAILJET_SECRET_KEY }}
          SUGGESTION_RECIPIENT_EMAIL: ${{ secrets.SUGGESTION_RECIPIENT_EMAIL }}
          SCRAPER_API_KEYS: ${{ secrets.SCRAPER_API_KEYS }}
        run: |
          # URL interna ao cluster — mais seguro e sem custo de egress.
          # Usuário/senha precisam ser URL-encoded: caracteres como @ : [ ]
          # sem encoding quebram o parser da URL (ex: "Invalid IPv6 URL").
          POSTGRES_USERNAME_ENC=$(jq -rn --arg v "$POSTGRES_USERNAME" '$v|@uri')
          POSTGRES_PASSWORD_ENC=$(jq -rn --arg v "$POSTGRES_PASSWORD" '$v|@uri')
          DB_URL="postgres://${POSTGRES_USERNAME_ENC}:${POSTGRES_PASSWORD_ENC}@postgres-rw.${NAMESPACE}:5432/backend"
          kubectl create secret generic app-secret \
            -n "$NAMESPACE" \
            --from-literal=QD_BACKEND_SECRET_KEY="$QD_BACKEND_SECRET_KEY" \
            --from-literal=QD_BACKEND_DB_URL="$DB_URL" \
            --from-literal=QD_DATA_DB_HOST="postgres-rw.${NAMESPACE}" \
            --from-literal=QD_DATA_DB_USER="$POSTGRES_USERNAME" \
            --from-literal=QD_DATA_DB_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=QD_BACKEND_DB_USER="$POSTGRES_USERNAME" \
            --from-literal=QD_BACKEND_DB_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=POSTGRES_COMPANIES_HOST="postgres-rw.${NAMESPACE}" \
            --from-literal=POSTGRES_COMPANIES_USER="$POSTGRES_USERNAME" \
            --from-literal=POSTGRES_COMPANIES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=QUERIDO_DIARIO_OPENSEARCH_HOST="$OPENSEARCH_HOST" \
            --from-literal=QUERIDO_DIARIO_OPENSEARCH_USER="$OPENSEARCH_USER" \
            --from-literal=QUERIDO_DIARIO_OPENSEARCH_PASSWORD="$OPENSEARCH_PASSWORD" \
            --from-literal=STORAGE_ACCESS_KEY="$STORAGE_ACCESS_KEY" \
            --from-literal=STORAGE_ACCESS_SECRET="$STORAGE_ACCESS_SECRET" \
            --from-literal=STORAGE_BUCKET="$STORAGE_BUCKET" \
            --from-literal=MAILJET_API_KEY="$MAILJET_API_KEY" \
            --from-literal=MAILJET_SECRET_KEY="$MAILJET_SECRET_KEY" \
            --from-literal=QUERIDO_DIARIO_SUGGESTION_RECIPIENT_EMAIL="$SUGGESTION_RECIPIENT_EMAIL" \
            --from-literal=QUERIDO_DIARIO_SCRAPER_API_KEYS="$SCRAPER_API_KEYS" \
            --dry-run=client -o yaml | kubectl apply -f -

      # ── Deploy ─────────────────────────────────────────────────────────────

      - name: Diff (o que será aplicado)
        run: kubectl diff -k k8s/overlays/production-local || true

      - name: Aplica overlay de produção
        run: |
          set -o pipefail
          if ! kubectl apply -k k8s/overlays/production-local 2>&1 | tee /tmp/apply.log; then
            # Divergência conhecida e aceita em produção: o StatefulSet do
            # opensearch usa um PVC referenciado manualmente via `volumes:`
            # (não volumeClaimTemplates, que é imutável e não reconcilia via
            # apply comum) — ver
            # k8s/overlays/production/opensearch/statefulset.yaml. Tolera
            # SOMENTE esse erro específico; qualquer outra falha de apply
            # continua quebrando o deploy.
            FAIL_LINES=$(grep -E '(is invalid:|^error:|Error from server)' /tmp/apply.log || true)
            if [ -n "$FAIL_LINES" ] && ! echo "$FAIL_LINES" | grep -qv 'StatefulSet "opensearch"'; then
              echo "::warning::Ignorando falha conhecida no StatefulSet opensearch (volumeClaimTemplates imutável, produção usa PVC manual — ver k8s/overlays/production/opensearch/statefulset.yaml)"
            else
              echo "$FAIL_LINES"
              exit 1
            fi
          fi

      - name: Aguarda rollout
        run: |
          kubectl rollout status deployment/frontend  -n ${{ env.NAMESPACE }} --timeout=300s
          kubectl rollout status deployment/api       -n ${{ env.NAMESPACE }} --timeout=300s
          kubectl rollout status deployment/backend   -n ${{ env.NAMESPACE }} --timeout=300s
          kubectl rollout status deployment/celery-worker -n ${{ env.NAMESPACE }} --timeout=300s

      # ── VPN cleanup ────────────────────────────────────────────────────────

      - name: Desconecta VPN
        if: always()
        run: sudo wg-quick down wg0
