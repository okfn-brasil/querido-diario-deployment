name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instala dependências
        run: pip install pyyaml

      - name: Valida referências a Secret/ConfigMap nos manifestos k8s
        run: python3 scripts/check_secret_refs.py
