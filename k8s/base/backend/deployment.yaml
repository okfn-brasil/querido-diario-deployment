---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: querido-diario
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Roda as migrations do Django antes do gunicorn subir. O Dockerfile/
      # deployment não faziam isso (diferente do docker-compose antigo, que
      # rodava "migrate && runserver") — perdido na migração pro k8s
      # (ADR-001). --noinput é seguro pra rodar de novo a cada rollout
      # (idempotente quando não há migration nova pendente).
      initContainers:
        - name: migrate
          image: ghcr.io/okfn-brasil/querido-diario-backend:latest
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom: &backend-env-from
            - configMapRef:
                name: app-config
          env: &backend-env
            - name: QD_BACKEND_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: QD_BACKEND_SECRET_KEY
            - name: QD_BACKEND_DB_URL
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: QD_BACKEND_DB_URL
            - name: MAILJET_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: MAILJET_API_KEY
            - name: MAILJET_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: MAILJET_SECRET_KEY
      containers:
        - name: backend
          image: ghcr.io/okfn-brasil/querido-diario-backend:latest
          command:
            - gunicorn
            - config.wsgi:application
            - -w
            - "2"
            - -b
            - :8000
            - --log-level
            - info
          ports:
            - containerPort: 8000
          envFrom: *backend-env-from
          env: *backend-env
          resources:
            limits:
              memory: 768Mi
            requests:
              memory: 384Mi
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
              # O kubelet bate no pod pelo IP interno (ex: 172.20.x.x:8000),
              # que o Django rejeita (DisallowedHost) por não estar em
              # QD_BACKEND_ALLOWED_HOSTS. Forçar um Host permitido no probe
              # em vez de abrir ALLOWED_HOSTS pra "*".
              httpHeaders:
                - name: Host
                  value: backend-api.queridodiario.org.br
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
              httpHeaders:
                - name: Host
                  value: backend-api.queridodiario.org.br
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: static-files
              mountPath: /opt/app/static
              # subPath evita montar a raiz do PVC: todo volume ext4 (block
              # storage, ex: Ceph RBD) tem um "lost+found" root:root/700 na
              # raiz, que o WhiteNoise não consegue ler ao varrer STATIC_ROOT
              # (PermissionError, crashloop). Um subdiretório nunca tem isso.
              subPath: static
      volumes:
        - name: static-files
          persistentVolumeClaim:
            claimName: static-files
