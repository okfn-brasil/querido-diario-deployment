---
# Namespace de testes do TCC no Revoada (querido-diario-tcc), modo A: CronJob
# data-processing + Tika compartilhado. É o equivalente do overlay dev para a
# campanha R do protocolo (querido-diario-estados#55); os modos B/C ficam em
# ../revoada-tcc-queue, que parte deste.
#
# Herda o overlay dev para que Postgres, OpenSearch, Garage, Redis e Tika
# tenham os mesmos limites da campanha K (kind): a única diferença entre as
# campanhas deve ser o hardware, o N e o teto. Em relação ao dev, este overlay:
#
# - troca o namespace para querido-diario-tcc e não cria o Namespace (o token
#   do TCC só enxerga o próprio namespace, que já existe);
# - remove a parte web (frontend, API, backend, Celery, Redis do backend,
#   Garage Web UI, IngressRoutes e Middlewares), que o pipeline de extração não
#   usa;
# - remove os Secrets com valores de dev: app-secret e postgres-credentials são
#   criados à parte por criar-segredos.sh, fora do repositório;
# - põe Postgres, OpenSearch, Garage e os Redis no local-path (disco local
#   do nó). Começou no ceph-block-hdd, mas o Ceph é compartilhado com o QD de
#   produção e, sob a carga dele, um fsync de 4 KB levava de 2 a 6 s (contra
#   1 ms no local-path; 26/11/2026): os tempos medidos passariam a depender
#   da produção. O admin do Revoada liberou o local-path (~700 GB livres por
#   nó);
# - fixa as imagens do data-processing e do Tika pelo digest (imagens/), as
#   mesmas nos três modos;
# - inclui o componente revoada-monitoring (Pushgateway + RBAC do
#   prometheus-k8s, querido-diario-estados#42).
#
# Uso: ver README.md nesta pasta. Sempre com --context revoada-testes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: querido-diario-tcc

resources:
  - ../dev

components:
  - ../../components/revoada-monitoring
  # Imagens fixadas por digest, as mesmas nos modos A, B e C
  - imagens

patches:
  # ── Recursos do dev que não sobem no Revoada ─────────────────────────────
  # Um patch `$patch: delete` por seletor: o nome do patch é ignorado, vale o
  # target
  - path: remover.yaml
    target:
      kind: Namespace
  - path: remover.yaml
    target:
      kind: Secret
      name: ^(app-secret|postgres-credentials)$
  - path: remover.yaml
    target:
      kind: (Deployment|Service)
      name: ^(api|backend|celery-beat|celery-worker|frontend|garage-webui|redis)$
  - path: remover.yaml
    target:
      kind: ConfigMap
      name: ^(frontend-env|censo-estados.*)$
  - path: remover.yaml
    target:
      kind: PersistentVolumeClaim
      name: ^(redis-data|static-files)$
  - path: remover.yaml
    target:
      kind: (IngressRoute|Middleware)

  # ── StorageClass ─────────────────────────────────────────────────────────
  - patch: |-
      - op: add
        path: /spec/storage/storageClass
        value: local-path
    target:
      kind: Cluster
      name: postgres
  - patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: local-path
    target:
      kind: StatefulSet
      name: opensearch
  - patch: |-
      - op: add
        path: /spec/storageClassName
        value: local-path
    target:
      kind: PersistentVolumeClaim
      name: garage-data
  # O OpenSearch roda como uid 1000. No Ceph o volume nascia com dono root e,
  # sem o fsGroup, ele falhava com AccessDeniedException em
  # /usr/share/opensearch/data; no local-path não é preciso, mas não atrapalha
  - patch: |-
      - op: add
        path: /spec/template/spec/securityContext
        value:
          fsGroup: 1000
    target:
      kind: StatefulSet
      name: opensearch

  # Memória do OpenSearch: igual à do dev (heap 512 MiB, limite 1500 MiB). No
  # piloto da R, com o índice no ceph-block-hdd, o limite chegou a subir para
  # 3 GiB (as buscas de tema reliam o HDD pela rede, 20–60 s cada); com o
  # local-path o índice volta a ficar em disco local, como no kind, e o
  # ajuste deixa de ser necessário: as duas campanhas ficam com os mesmos
  # limites

  # Tika: limite do contêiner de 1500 MiB para 2 GiB, com o mesmo heap do dev
  # (-Xmx1400m em JAVA_TOOL_OPTIONS). Com 1500 MiB sobravam ~100 MiB para a
  # memória fora do heap (metaspace, threads, GC), que cresce com o número de
  # CPUs que a JVM enxerga: 12 no notebook da campanha K, 96 nas hipos. No
  # piloto da R (26/11/2026) o Tika foi OOMKilled no meio do E1-A; na K, nunca
  # (48 execuções). Compensa a diferença de hardware sem mudar o heap, que é
  # o que limita a extração
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 2Gi
    target:
      kind: Deployment
      name: apache-tika

  # ── ConfigMap: o que no dev aponta para o kind ───────────────────────────
  # O STORAGE_ENDPOINT (http://garage:3900) já serve. Os arquivos não são
  # abertos por navegador, então a URL pública fica com o próprio Garage
  - patch: |-
      - op: replace
        path: /data/QUERIDO_DIARIO_FILES_ENDPOINT
        value: http://garage:3900/queridodiariobucket
      - op: replace
        path: /data/LOG_LEVEL
        value: info
    target:
      kind: ConfigMap
      name: app-config
