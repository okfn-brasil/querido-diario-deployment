---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - certificates.yaml
  # OpenSearch single-node dentro do cluster (ver ADR-008)
  - opensearch/statefulset.yaml
  # CA interna + certificado de servidor (cert-manager) pro TLS do OpenSearch
  - opensearch/certs.yaml
  # Middleware Traefik api-retry (usado só pelas rotas de produção da API)
  - traefik-api-retry.yaml

# Defina as imagens com tags fixas para produção (evite :latest)
images:
  - name: ghcr.io/okfn-brasil/querido-diario-api
    newTag: "v0.22.10"
  - name: ghcr.io/okfn-brasil/querido-diario-frontend
    newTag: "6d5e2bc"
  - name: ghcr.io/okfn-brasil/querido-diario-backend
    newTag: "latest"
  - name: ghcr.io/okfn-brasil/querido-diario-data-processing
    newTag: "latest"
  - name: ghcr.io/okfn-brasil/querido-diario-data-processing/apache-tika
    newTag: "latest"

patches:
  # ── Réplicas ───────────────────────────────────────────────────────────────
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: frontend

  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 5
    target:
      kind: Deployment
      name: api

  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: celery-worker

  # ── API: recursos, rollout e probes (reconciliado com o cluster) ──────────
  # Estes valores já estavam em produção (ajustados à mão com kubectl) e
  # divergiam do repo; um apply do overlay os reverteria. Reconciliado em
  # 2026-10-23.
  # - Probes: as buscas no índice queridodiario chegaram a levar 10-20s e
  #   ocupam os workers da API; com timeout de 5s no /health os pods ficavam
  #   0/1 mesmo atendendo requisições. Readiness com timeout 10s/6 falhas,
  #   startupProbe para o boot e liveness por TCP (não depende de /health, que
  #   pode demorar sob carga, e por isso não mata o pod por lentidão).
  # - Rollout com maxUnavailable 0 + podAntiAffinity (api-pdb exige
  #   minAvailable 3 de 5).
  - patch: |-
      - op: add
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
      - op: add
        path: /spec/template/spec/affinity
        value:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: app
                        operator: In
                        values:
                          - api
                  topologyKey: kubernetes.io/hostname
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          limits:
            cpu: 1500m
            memory: 4Gi
          requests:
            cpu: 150m
            memory: 1Gi
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe
        value:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe
        value:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 6
      - op: add
        path: /spec/template/spec/containers/0/startupProbe
        value:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 20
    target:
      kind: Deployment
      name: api

  # ── PostgreSQL via CloudNativePG ───────────────────────────────────────────
  - patch: |-
      - op: replace
        path: /spec/instances
        value: 3
      - op: replace
        path: /spec/storage/size
        value: 250Gi
      - op: add
        path: /spec/storage/storageClass
        value: ceph-block-hdd
      - op: replace
        path: /spec/resources/limits/memory
        value: 1Gi
      - op: replace
        path: /spec/resources/requests/memory
        value: 800Mi
      - op: add
        path: /spec/resources/limits/cpu
        value: "500m"
      - op: add
        path: /spec/resources/requests/cpu
        value: "200m"
      - op: replace
        path: /spec/postgresql/parameters/shared_buffers
        value: "256MB"
    target:
      kind: Cluster
      name: postgres

  # ── API: confiar na CA interna do OpenSearch (cert-manager) ────────────────
  # opensearch-py usa o bundle do certifi (não o trust store do SO), então
  # SSL_CERT_FILE não tem efeito — a única forma de confiar no certificado do
  # OpenSearch (emitido em opensearch/certs.yaml) sem alterar código da
  # aplicação é injetar a CA no próprio arquivo cacert.pem do certifi antes
  # do processo principal subir. Só produção: dev roda OpenSearch sem TLS
  # (DISABLE_SECURITY_PLUGIN=true), não existe o secret opensearch-server-tls.
  - patch: |-
      - op: add
        path: /spec/template/spec/initContainers
        value:
          - name: trust-opensearch-ca
            image: ghcr.io/okfn-brasil/querido-diario-api:v0.22.8
            command:
              - sh
              - -c
              - |
                set -e
                cp "$(python3 -c 'import certifi; print(certifi.where())')" /shared/cacert.pem
                cat /opensearch-ca/ca.crt >> /shared/cacert.pem
            volumeMounts:
              - name: certifi-bundle
                mountPath: /shared
              - name: opensearch-ca
                mountPath: /opensearch-ca
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: certifi-bundle
            emptyDir: {}
          - name: opensearch-ca
            secret:
              secretName: opensearch-server-tls
              items:
                - key: ca.crt
                  path: ca.crt
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: certifi-bundle
            mountPath: /usr/local/lib/python3.12/site-packages/certifi/cacert.pem
            subPath: cacert.pem
    target:
      kind: Deployment
      name: api

  # ── data-processing: confiar na CA interna do OpenSearch (cert-manager) ────
  # Mesmo motivo do patch acima (API) — o CronJob data-processing também fala
  # com o OpenSearch via opensearch-py e precisa da mesma CA no bundle do
  # certifi. Reaproveita a própria imagem do data-processing no initContainer
  # (python3.14, caminho do certifi diferente do da API que é python3.12).
  - patch: |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/initContainers
        value:
          - name: trust-opensearch-ca
            image: ghcr.io/okfn-brasil/querido-diario-data-processing:latest
            command:
              - sh
              - -c
              - |
                set -e
                cp "$(python3 -c 'import certifi; print(certifi.where())')" /shared/cacert.pem
                cat /opensearch-ca/ca.crt >> /shared/cacert.pem
            volumeMounts:
              - name: certifi-bundle
                mountPath: /shared
              - name: opensearch-ca
                mountPath: /opensearch-ca
      - op: add
        path: /spec/jobTemplate/spec/template/spec/volumes
        value:
          - name: certifi-bundle
            emptyDir: {}
          - name: opensearch-ca
            secret:
              secretName: opensearch-server-tls
              items:
                - key: ca.crt
                  path: ca.crt
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/volumeMounts
        value:
          - name: certifi-bundle
            mountPath: /usr/local/lib/python3.14/site-packages/certifi/cacert.pem
            subPath: cacert.pem
    target:
      kind: CronJob
      name: data-processing

  # ── StorageClass Ceph para volumes persistentes ────────────────────────────
  - patch: |-
      - op: add
        path: /spec/storageClassName
        value: ceph-block-hdd
    target:
      kind: PersistentVolumeClaim
      name: redis-data

  - patch: |-
      - op: add
        path: /spec/storageClassName
        value: ceph-block-hdd
    target:
      kind: PersistentVolumeClaim
      name: static-files

  # ── ConfigMap: domínio e URLs de produção ─────────────────────────────────
  # Domínio base: queridodiario.org.br
  # Para trocar o domínio, alterar todos os valores desta seção e os
  # IngressRoutes abaixo. Não existe variável única no Kustomize para
  # interpolação em strings — ver CLAUDE.md para alternativas (Helm).
  - patch: |-
      - op: replace
        path: /data/DOMAIN
        value: queridodiario.org.br
      - op: replace
        path: /data/QD_API_URL
        value: https://api.queridodiario.org.br
      - op: replace
        path: /data/QD_BACKEND_ALLOWED_HOSTS
        value: "queridodiario.org.br,www.queridodiario.org.br,api.queridodiario.org.br,www.api.queridodiario.org.br,backend-api.queridodiario.org.br,www.backend-api.queridodiario.org.br"
      - op: replace
        path: /data/STATIC_URL
        value: https://backend-api.queridodiario.org.br/api/static/
      - op: replace
        path: /data/FRONT_BASE_URL
        value: https://queridodiario.org.br
      # Reescreve dinamicamente as URLs de arquivo antigas (armazenadas como
      # URL absoluta no campo file_raw_txt do OpenSearch, herdadas de antes da
      # migração de storage — ver docs/storage-migration-cloudfront.md) para o
      # domínio atual, sem precisar reprocessar os ~928 mil documentos
      # afetados. Lógica em querido-diario-api/utils/url_builder.py.
      - op: replace
        path: /data/REPLACE_FILE_URL_BASE
        value: "True"
      - op: replace
        path: /data/QUERIDO_DIARIO_FILES_ENDPOINT
        value: data.queridodiario.ok.org.br
    target:
      kind: ConfigMap
      name: app-config

  # ── Frontend: env.js aponta para API de produção ──────────────────────────
  - patch: |-
      - op: replace
        path: /data/env.js
        value: |
          (function (window) {
            window.__env = window.__env || {};
            window.__env.envFileLoaded = true;
            window.__env.apiUrl = 'https://api.queridodiario.org.br';
            window.__env.qdApiSearchResultMaxSize = 10000;
          }(this));
    target:
      kind: ConfigMap
      name: frontend-env

  # ── IngressRoutes HTTPS ────────────────────────────────────────────────────
  # tls.secretName em vez de tls.certResolver: o Traefik do Revoada não tem
  # certresolver ACME configurado; o cert-manager cuida dos certificados.
  # Os IngressRoutes *-http da base ficam inativos: o haproxy externo já
  # redireciona HTTP→HTTPS antes de chegar ao Traefik.
  - patch: |-
      - op: replace
        path: /spec
        value:
          entryPoints:
            - websecure
          routes:
            - match: "Host(`queridodiario.org.br`)"
              kind: Rule
              priority: 10
              middlewares:
                - name: security-headers
                - name: compression
              services:
                - name: frontend
                  port: 80
            - match: "Host(`www.queridodiario.org.br`)"
              kind: Rule
              priority: 200
              middlewares:
                - name: www-to-non-www
              services:
                - name: frontend
                  port: 80
          tls:
            secretName: queridodiario-tls
    target:
      kind: IngressRoute
      name: frontend

  - patch: |-
      - op: replace
        path: /spec
        value:
          entryPoints:
            - websecure
          routes:
            - match: "Host(`api.queridodiario.org.br`)"
              kind: Rule
              priority: 10
              middlewares:
                - name: api-strip-prefix
                - name: cors-headers
                - name: api-rate-limit
                - name: security-headers
                - name: compression
                - name: api-retry
              services:
                - name: api
                  port: 8080
            - match: "Host(`www.api.queridodiario.org.br`)"
              kind: Rule
              priority: 200
              middlewares:
                - name: www-to-non-www
                - name: api-retry
              services:
                - name: api
                  port: 8080
            - match: "Host(`queridodiario.org.br`) && PathPrefix(`/api`)"
              kind: Rule
              priority: 100
              middlewares:
                - name: cors-redirect
                - name: api-redirect
                - name: api-retry
              services:
                - name: api
                  port: 8080
          tls:
            secretName: queridodiario-tls
    target:
      kind: IngressRoute
      name: api

  - patch: |-
      - op: replace
        path: /spec
        value:
          entryPoints:
            - websecure
          routes:
            - match: "Host(`backend-api.queridodiario.org.br`)"
              kind: Rule
              middlewares:
                - name: cors-headers
                - name: api-rate-limit
                - name: security-headers
                - name: compression
              services:
                - name: backend
                  port: 8000
            - match: "Host(`www.backend-api.queridodiario.org.br`)"
              kind: Rule
              priority: 200
              middlewares:
                - name: www-to-non-www
              services:
                - name: backend
                  port: 8000
          tls:
            secretName: queridodiario-tls
    target:
      kind: IngressRoute
      name: backend

  # ── Exclui do output: namespace e templates de secrets ────────────────────────
  # O namespace já existe (gerenciado pelo admin) e os secrets são gerenciados
  # pelo CI (via kubectl create secret) ou manualmente. O kustomize não deve
  # sobrescrever esses recursos com os templates placeholder da base.
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: querido-diario
    target:
      kind: Namespace
      name: querido-diario

  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: app-secret
    target:
      kind: Secret
      name: app-secret

  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: postgres-credentials
    target:
      kind: Secret
      name: postgres-credentials
