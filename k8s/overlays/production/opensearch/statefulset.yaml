---
# OpenSearch em produção: single-node dentro do cluster k8s (Revoada).
# Substitui a VM externa via Docker Compose (ver ADR-008, que supera o ADR-003).
#
# Requisitos:
#   - vm.max_map_count >= 262144 no node onde o pod roda. Garantido abaixo pelo
#     initContainer privileged. Se o cluster negar containers privileged
#     (Pod Security Admission), a alternativa é pedir ao CCSL para configurar
#     `vm.max_map_count=262144` permanentemente nos nodes (/etc/sysctl.conf) e
#     remover o initContainer abaixo.
#   - Secret "app-secret" com a chave QUERIDO_DIARIO_OPENSEARCH_PASSWORD
#     preenchida — é reaproveitada aqui como senha do usuário admin do
#     OpenSearch, evitando manter a senha em dois lugares.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
  namespace: querido-diario
spec:
  serviceName: opensearch
  replicas: 1
  selector:
    matchLabels:
      app: opensearch
  template:
    metadata:
      labels:
        app: opensearch
    spec:
      # A imagem oficial do OpenSearch roda como usuário não-root (uid/gid
      # 1000). Sem fsGroup, o PVC do Ceph é montado como root:root e o
      # processo não consegue escrever em /usr/share/opensearch/data
      # (AccessDeniedException no boot).
      securityContext:
        fsGroup: 1000
      initContainers:
        # OpenSearch requer vm.max_map_count >= 262144 no host.
        # Fallback caso privileged seja bloqueado: configurar no node via CCSL
        # e remover este initContainer.
        - name: sysctl
          image: busybox
          command: ["sysctl", "-w", "vm.max_map_count=262144"]
          securityContext:
            privileged: true
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.19.1
          ports:
            - containerPort: 9200
              name: http
            - containerPort: 9300
              name: transport
          env:
            - name: discovery.type
              value: single-node
            # install_demo_configuration.sh tenta sobrescrever
            # esnode.pem/esnode-key.pem/root-ca.pem a cada boot — quebra
            # com os certs montados via cert-manager (Secret = read-only).
            # opensearch.yml próprio (ver certs.yaml) já traz
            # plugins.security.ssl.* apontando pros certs corretos, então
            # o instalador não faz falta.
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              # Heap = ~50% da memória do container (regra geral da JVM,
              # deixa o resto pro page cache do SO / off-heap) — pra um
              # índice de ~400G, 1GB de heap era claramente insuficiente.
              value: "-Xms8g -Xmx8g"
            - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: QUERIDO_DIARIO_OPENSEARCH_PASSWORD
          resources:
            limits:
              memory: 16Gi
              cpu: "2"
            requests:
              memory: 12Gi
              cpu: "500m"
          # Liveness só verifica se o processo está respondendo (qualquer
          # resposta HTTP), não o status do cluster — "red" é normal e
          # esperado por vários minutos após um restart, enquanto os shards
          # são recuperados do disco (single-node, sem réplicas). Usar
          # status do cluster aqui já causou um crash loop real: o probe
          # matava o pod repetidamente antes da recuperação terminar,
          # reiniciando a recuperação do zero a cada vez, indefinidamente.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  curl -sk -o /dev/null -w '%{http_code}'
                  -u "admin:$OPENSEARCH_INITIAL_ADMIN_PASSWORD"
                  https://localhost:9200/
                  | grep -q '^200$'
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          # Readiness pode continuar exigindo não-red (só tira do Service
          # até os dados ficarem disponíveis) — falha de readiness não mata
          # o pod, só remove dos endpoints, então é seguro ser mais rígido
          # aqui.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  curl -sk -u "admin:$OPENSEARCH_INITIAL_ADMIN_PASSWORD"
                  https://localhost:9200/_cluster/health
                  | grep -qv '"status":"red"'
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - name: opensearch-data
              mountPath: /usr/share/opensearch/data
            - name: opensearch-config
              mountPath: /usr/share/opensearch/config/opensearch.yml
              subPath: opensearch.yml
            - name: opensearch-certs
              mountPath: /usr/share/opensearch/config/esnode.pem
              subPath: tls.crt
            - name: opensearch-certs
              mountPath: /usr/share/opensearch/config/esnode-key.pem
              subPath: tls.key
            - name: opensearch-certs
              mountPath: /usr/share/opensearch/config/root-ca.pem
              subPath: ca.crt
      volumes:
        - name: opensearch-config
          configMap:
            name: opensearch-config
        - name: opensearch-certs
          secret:
            secretName: opensearch-server-tls
  # ATENÇÃO: em produção hoje (Revoada), o pod usa um PVC criado manualmente
  # ("opensearch-data-v2", 400Gi) referenciado direto via `volumes:` no pod
  # template — não este volumeClaimTemplates. Isso porque volumeClaimTemplates
  # é imutável num StatefulSet já existente e não permite reduzir o storage
  # (era 900Gi antes de uma migração via snapshot/restore pra um PVC menor).
  # Esse volumeClaimTemplates aqui só é usado num deploy do zero (novo
  # ambiente, ou local): nesse caso o Kubernetes cria o PVC automaticamente
  # no tamanho abaixo.
  #
  # Resize do PVC em produção hoje: manual, via `kubectl edit pvc
  # opensearch-data-v2` (ou patch), fora do manifesto — ceph-block-hdd só
  # suporta expansão online, nunca redução.
  #
  # Pra produção voltar a usar volumeClaimTemplates de fato (auto-gerenciado
  # pelo manifesto): não dá pra fazer via `kubectl apply` simples (o mesmo
  # erro de imutabilidade acima se aplica). É preciso repetir o processo de
  # migração manual: 1) snapshot/restore do índice pra um PVC novo cujo nome
  # siga o padrão que o volumeClaimTemplates geraria
  # (`opensearch-data-opensearch-0`) — ou aceitar que o StatefulSet vai
  # provisionar um PVC vazio com esse nome; 2) deletar e recriar o objeto
  # StatefulSet (delete não apaga PVCs) já sem o `volumes:` explícito, só com
  # este volumeClaimTemplates; 3) verificar que o pod voltou saudável e com
  # os dados corretos antes de apagar o PVC "opensearch-data-v2" antigo.
  volumeClaimTemplates:
    - metadata:
        name: opensearch-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ceph-block-hdd
        resources:
          requests:
            # ~275G de dados reais + margem sob os watermarks de disco do
            # OpenSearch (85%/90%/95%).
            storage: 400Gi
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: querido-diario
spec:
  selector:
    app: opensearch
  ports:
    - port: 9200
      targetPort: 9200
      name: http
