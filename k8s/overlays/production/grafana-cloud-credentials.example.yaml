---
# TEMPLATE — NÃO é aplicado pelo kustomization (não está em `resources`).
# Documenta o Secret exigido pelo Grafana Cloud (chart grafana/k8s-monitoring,
# ver k8s/monitoring/grafana-cloud/ e docs/grafana-cloud.md). Criar manualmente
# no cluster, com os valores reais, e nunca versionar:
#
#   kubectl create secret generic grafana-cloud-credentials -n querido-diario \
#     --from-literal=username='<ID-DA-INSTANCIA-FLEET-MANAGEMENT>' \
#     --from-literal=password='<TOKEN-GRAFANA-CLOUD>'
#
# Chaves lidas pelo chart (auth.type=basic): `username` e `password` (esta
# também usada como GCLOUD_RW_API_KEY); `ca` é opcional.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-cloud-credentials
  namespace: querido-diario
type: Opaque
stringData:
  username: "<ID-DA-INSTANCIA-FLEET-MANAGEMENT>"
  password: "<TOKEN-GRAFANA-CLOUD>"
