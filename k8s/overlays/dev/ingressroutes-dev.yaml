---
# IngressRoutes HTTP para *.queridodiario.local
# Os IngressRoutes da base usam websecure (HTTPS) e hostnames de produção.
# Em dev, o Traefik só tem o entrypoint web (porta 80), então os de produção
# são ignorados automaticamente. Estes adicionam as rotas locais.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: api-dev
  namespace: querido-diario
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`api.queridodiario.local`)
      kind: Rule
      middlewares:
        - name: cors-headers
        - name: api-rate-limit
        - name: compression
      services:
        - name: api
          port: 8080
    - match: Host(`queridodiario.local`) && PathPrefix(`/api`)
      kind: Rule
      priority: 100
      middlewares:
        - name: api-strip-prefix
        - name: cors-headers
        - name: compression
      services:
        - name: api
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: backend-dev
  namespace: querido-diario
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`backend-api.queridodiario.local`)
      kind: Rule
      middlewares:
        - name: cors-headers
        - name: api-rate-limit
        - name: compression
      services:
        - name: backend
          port: 8000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: frontend-dev
  namespace: querido-diario
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`queridodiario.local`)
      kind: Rule
      priority: 10
      middlewares:
        - name: compression
      services:
        - name: frontend
          port: 80
---
# Arquivos dos diários (PDF/TXT) servidos pelo endpoint web do Garage em
# http://queridodiario.local/queridodiariobucket/..., que é o
# QUERIDO_DIARIO_FILES_ENDPOINT do overlay dev. O endpoint web escolhe o bucket
# pelo header Host, por isso o middleware troca o Host pelo nome do bucket.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: files-strip-prefix
  namespace: querido-diario
spec:
  stripPrefix:
    prefixes:
      - /queridodiariobucket
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: files-bucket-host
  namespace: querido-diario
spec:
  headers:
    customRequestHeaders:
      Host: queridodiariobucket
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: files-dev
  namespace: querido-diario
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`queridodiario.local`) && PathPrefix(`/queridodiariobucket`)
      kind: Rule
      priority: 100
      middlewares:
        - name: files-strip-prefix
        - name: files-bucket-host
      services:
        - name: garage
          port: 3902
