# Source: k8s-monitoring/charts/telemetryServices/charts/sdkInjector/templates/webhook/serving-cert-secret.yaml
# Persistence layer for the controller-managed webhook serving certificate. The
# in-process cert rotator (see --enable-cert-rotation) populates ca.crt/ca.key/tls.crt/
# tls.key here; it updates this Secret but never creates it, so the chart
# pre-creates it empty. Only rendered when cert-manager is not in use.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-cloud-k8s-injection-controller-serving-cert
  namespace: querido-diario
  labels:
    helm.sh/chart: sdkInjector-0.2.1
    app.kubernetes.io/name: k8s-injection-controller
    app.kubernetes.io/instance: grafana-cloud
    control-plane: controller-manager
    app.kubernetes.io/version: "0.2.0"
    app.kubernetes.io/managed-by: Helm
type: Opaque
---
# Source: k8s-monitoring/charts/telemetryServices/charts/sdkInjector/templates/sdk-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-cloud-k8s-injection-controller-sdk-config
  namespace: querido-diario
  labels:
    helm.sh/chart: sdkInjector-0.2.1
    app.kubernetes.io/name: k8s-injection-controller
    app.kubernetes.io/instance: grafana-cloud
    control-plane: controller-manager
    app.kubernetes.io/version: "0.2.0"
    app.kubernetes.io/managed-by: Helm
data:
  # config.SDKInject document consumed by the controller via --config. The
  # controller selects matching workloads but performs no mutation when this is
  # absent (image_volume_root empty).
  sdk-inject.yaml: |
    debug: false
    image_volume_root: ghcr.io/grafana/beyla/inject-sdk-image
    image_version: "0.0.13"
    injection_mode: auto
    propagators:
      - tracecontext
      - baggage
    export:
      traces: true
      metrics: true
      logs: false
    enabled_sdks:
      - nodejs
      - python
      - java
      - dotnet
