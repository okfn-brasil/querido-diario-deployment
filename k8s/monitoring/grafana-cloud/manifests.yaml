apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-cloud-k8s-injection-controller
  namespace: querido-diario
  labels:
    helm.sh/chart: sdkInjector-0.2.1
    app.kubernetes.io/name: k8s-injection-controller
    app.kubernetes.io/instance: grafana-cloud
    control-plane: controller-manager
    app.kubernetes.io/version: "0.2.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-injection-controller
      app.kubernetes.io/instance: grafana-cloud
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        # Roll the pod whenever the mounted SDK config changes.
        checksum/sdk-config: 2f6bdfa392bf50f9440fd89dc6d3232af0a1c870bec292888e19a5f2c91d5262
        # Advertise the metrics endpoint for annotation-based Prometheus discovery.
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
        prometheus.io/scrape: "true"
      labels:
        app.kubernetes.io/name: k8s-injection-controller
        app.kubernetes.io/instance: grafana-cloud
        control-plane: controller-manager
    spec:
      serviceAccountName: grafana-cloud-k8s-injection-controller
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: "ghcr.io/grafana/k8s-injection-controller:0.2.0"
          imagePullPolicy: IfNotPresent
          command:
            - /manager
          args:
            - --health-probe-bind-address=:8081
            - --leader-elect
            - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
            - --enable-cert-rotation
            - --webhook-cert-secret=grafana-cloud-k8s-injection-controller-serving-cert
            - --mutating-webhook-name=grafana-cloud-k8s-injection-controller-mutating-webhook
            - --validating-webhook-name=grafana-cloud-k8s-injection-controller-validating-webhook
            - --metrics-bind-address=:8080
            - --metrics-secure=false
            - --config=/etc/beyla-injector/sdk-inject.yaml
          env:
            # Dialed by the controller before its first eviction sweep so it
            # waits for the webhook Service VIP to be programmed.
            - name: WEBHOOK_SERVICE_ADDR
              value: grafana-cloud-k8s-injection-controller-webhook.querido-diario.svc:443
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: WATCH_NAMESPACE
              value: "querido-diario"
            - name: ALLOWED_CONFIGMAP_WRITERS
              value: "system:serviceaccount:querido-diario:grafana-cloud-alloy"
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: webhook-server
              containerPort: 9443
              protocol: TCP
            - name: metrics
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              # Read-only in both modes. In self-signed mode the cert rotator
              # writes the Secret via the API (not this dir); the kubelet projects
              # it here. cert-controller never writes the cert dir itself.
              readOnly: true
            - name: sdk-config
              mountPath: /etc/beyla-injector
              readOnly: true
      volumes:
        - name: webhook-certs
          # Mount the serving-cert Secret in both modes. cert-manager populates
          # it in cert-manager mode; the in-process cert rotator populates it in
          # self-signed mode. cert-controller writes only the Secret (via the
          # API) and waits for the kubelet to project it onto disk here — it does
          # NOT write the cert dir, so a writable emptyDir would never get a cert
          # and the rotator's readiness gate would never fire.
          secret:
            secretName: grafana-cloud-k8s-injection-controller-serving-cert
        - name: sdk-config
          configMap:
            name: grafana-cloud-k8s-injection-controller-sdk-config
