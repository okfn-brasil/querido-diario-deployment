# Source: k8s-monitoring/templates/alloy-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-cloud-alloy
  namespace: querido-diario
data:
  config.alloy: |
    remote.kubernetes.secret "alloy_remote_cfg" {
      name      = "grafana-cloud-credentials"
      namespace = "querido-diario"
    } // remote.kubernetes.secret "alloy_remote_cfg"
    
    remotecfg {
      id = string.format("grafana-cloud-%s-%s-%s-%s", "revoada-qd", "querido-diario", "alloy", sys.env("K8S_NODE_NAME"))
      url = "https://fleet-management-prod-015.grafana.net"
      basic_auth {
        username = convert.nonsensitive(remote.kubernetes.secret.alloy_remote_cfg.data["username"])
        password = remote.kubernetes.secret.alloy_remote_cfg.data["password"]
      }
      tls_config {
        insecure_skip_verify = false
        ca_pem = convert.nonsensitive(remote.kubernetes.secret.alloy_remote_cfg.data["ca"])
        cert_pem = convert.nonsensitive(remote.kubernetes.secret.alloy_remote_cfg.data["cert"])
        key_pem = remote.kubernetes.secret.alloy_remote_cfg.data["key"]
      }
      poll_frequency = "30s"
      attributes = {
        "cluster" = "revoada-qd",
        "namespace" = "querido-diario",
        "platform" = "kubernetes",
        "presets" = "large,root,host-network,host-storage,host-cgroup,clustered,service-discovery,filesystem-log-reader,daemonset,otel-receiver",
        "release" = "grafana-cloud",
        "service-discovery" = "true",
        "source" = "k8s-monitoring",
        "sourceVersion" = "4.5.3",
        "workloadName" = "alloy",
        "workloadType" = "daemonset",
      }
    }
