# Valores do chart grafana/k8s-monitoring (Grafana Cloud) — produção (Revoada).
# Instalação via Helm (não é Kustomize): `make grafana-cloud-install`.
# Ver docs/grafana-cloud.md.
#
# Equivale ao comando gerado pelo Grafana Cloud (Fleet Management). A
# configuração dos coletores e destinos é entregue remotamente pelo Fleet
# Management; o chart só sobe o Alloy e os serviços de telemetria.
#
# Requer o Secret `grafana-cloud-credentials` no namespace querido-diario,
# criado manualmente (nunca versionar valores — ver
# k8s/overlays/production/grafana-cloud-credentials.example.yaml).

cluster:
  name: revoada-qd

collectorCommon:
  alloy:
    remoteConfig:
      enabled: true
      url: https://fleet-management-prod-015.grafana.net
      auth:
        type: basic
      secret:
        create: false
        name: grafana-cloud-credentials
        namespace: querido-diario

collectors:
  alloy:
    presets:
      - large
      - root
      - host-network
      - host-storage
      - host-cgroup
      - clustered
      - service-discovery
      - filesystem-log-reader
      - daemonset
      - otel-receiver
    extraService:
      enabled: true
      name: otel-receiver

telemetryServices:
  # Desligado em produção: no Revoada o node-exporter nosso fica Pending (porta
  # do host já ocupada em 1 nó e NodeAffinity não satisfeita nos outros 5).
  # Mantenha `deploy: true` em execuções locais.
  node-exporter:
    deploy: false

  kube-state-metrics:
    deploy: true
    # Reduz séries ativas (o tenant do Grafana Cloud tem limite de 15.000): só o
    # nosso namespace, em vez de ceph-cluster, rook-ceph, openstack etc. Os
    # recursos de escopo de cluster (nodes, namespaces...) continuam cobertos.
    namespaces: querido-diario
    # Métricas de init containers não são usadas nos dashboards.
    metricDenylist:
      - kube_pod_init_container_.*

  # Desligado: sem agentes Beyla (eBPF) nem pipeline que use o cache de
  # metadados do Kubernetes, ele só ocupava um pod. Reative junto com um
  # pipeline de Application Observability, se um dia for necessário.
  beyla:
    deploy: false

  opencost:
    deploy: false

  sdkInjector:
    deploy: true
    allowedConfigMapWriters: system:serviceaccount:querido-diario:grafana-cloud-alloy
