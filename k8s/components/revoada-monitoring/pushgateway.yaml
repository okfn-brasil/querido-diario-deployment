---
# Pushgateway do namespace: o CronJob data-processing é batch e envia as
# séries qd_* no fim de cada execução (monitoring/metrics.py, B2). Sem
# persistência: os valores se perdem se o pod reiniciar, mas o Prometheus já
# os terá raspado. Mesma versão do chart usado no kind (make k8s-local-monitoring).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushgateway
  namespace: querido-diario
  labels:
    app: pushgateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pushgateway
  template:
    metadata:
      labels:
        app: pushgateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: pushgateway
          image: quay.io/prometheus/pushgateway:v1.11.4
          ports:
            - name: http
              containerPort: 9091
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: pushgateway
  namespace: querido-diario
  labels:
    app: pushgateway
spec:
  selector:
    app: pushgateway
  ports:
    - name: http
      port: 9091
      targetPort: http
